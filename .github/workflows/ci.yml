name: Polyglot CI Pipeline

# Trigger on every push to main and on every Pull Request targeting main
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Cancel in-progress runs if a new commit is pushed to the same PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job 1: Python 3.13 AI Engine (FastAPI + LanceDB + BM25 + FlashRank)
  ai-service:
    name: AI Service (Python 3.13)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ai-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv and Python 3.13
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true
          cache-dependency-glob: "services/ai-service/uv.lock"

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run RAG pipeline unit & integration tests
        run: uv run python tests/test_pipeline.py

  # Job 2: Java 21 Core Gateway (Spring Boot 3 + WebFlux)
  core-service:
    name: Core Gateway (Java 21)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/core-service
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "maven"

      - name: Run Maven unit & reactive stream tests
        run: ./mvnw test -B

  # Job 3: TypeScript + React Web UI (tsc + Vite production build)
  web-ui:
    name: Web UI (TypeScript + React)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web-ui
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: services/web-ui/package-lock.json

      - name: Install npm dependencies
        run: npm ci

      - name: Typecheck (tsc) and build production bundle (Vite)
        run: npm run build

