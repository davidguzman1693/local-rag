server:
  port: ${SERVER_PORT:8080}

spring:
  application:
    name: core-service
  datasource:
    url: ${CORE_DB_URL:jdbc:h2:file:../../data/core-db/local-rag;AUTO_SERVER=TRUE}
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true
      path: /h2-console
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  mvc:
    async:
      request-timeout: 180000

local-rag:
  ai-service:
    base-url: ${AI_SERVICE_URL:http://127.0.0.1:8000}
    timeout-seconds: 120

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
